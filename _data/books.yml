- title: "Leviathan Falls"
  author: "James S.A. Corey"
  cover: "/assets/img/books/leviathan-falls.jpg"
  start: "2026-06-15"
  end: "2026-08-09"
  summary: "The grand finale of The Expanse is full of twists and turns and it absolutely blew me away. Even with all the stuff going on I think they manage to tie the knots and deliver in the end. Crazy adventure and I'm so glad I gave the whole thing a read!"
- title: "Strange Dogs"
  author: "James S.A. Corey"
  cover: "/assets/img/books/strange-dogs.jpg"
  start: "2026-03-23"
  end: "2026-05-27"
  summary: "As Duarte and his people build a new empire in Laconia, we follow a young girl, Cara, who discovers something that will change everything."
- title: "Tiamat's Wrath"
  author: "James S.A. Corey"
  cover: "/assets/img/books/tiamats-wrath.jpg"
  start: "2026-05-08"
  end: "2026-06-09"
  summary: "Everything is now under Laconian control, but the resistance remains. The crew is separated and laying low, although Holden is now a special prisoner, a dancing Bear for Duarte. After some experiments on a cosmic scale go wrong, a chain of events may give our heroes the chance to revoke Laconia's rule"
