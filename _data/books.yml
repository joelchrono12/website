- title: "Persepolis Rising"
  author: "James S.A. Corey"
  cover: "/assets/img/books/persepolis-rising.jpg"
  start: "2026-01-17"
  end: "2026-03-02"
  summary: "Thirty years after the events of the previous books, new colony worlds have flourished, and even if there is struggle here and there, things are looking well. The inner planets and the Belt have become somewhat stable allies, and have managed to get the Transport Union up and running, even if some prejudice persists. Meanwhile, the crew of the Rocinante continues to help out where they can to keep the galaxy at peace. Until a new menace showed up. Humans, again."
- title: "Exit Strategy"
  author: "Martha Wells"
  cover: "/assets/img/books/exit-strategy.jpg"
  start: "2025-10-18"
  end: "2026-01-05"
  summary: "Murderbot has managed to find some useful information for its human friends, however, it may as well be too late for them. Murderbot realizes its friends are being followed, and that its best friend is being held hostage as well. It's a lose lose situation, but Murderbot will do all it can to save them, and get back all of its friends to safety. Facing against powerful enemies, and a bunch of ads."
- title: "Overscan"
  author: "Nicholas Bernard"
  cover: "/assets/img/books/overscan.jpg"
  end: "2025-10-20"
  start: "2025-09-02"
  summary: "This was an amazing collaborative effort between multiple authors who worked together to make a small collection of short stories. The whole anthology, whose subtitle is Stories from Beyond the Screen’s Edge, was simply a joy to read. I read half of them in one day, and I would have done them all in one sitting if it wasn’t because I’m a professional procrastinator. I will actually read it again and write a proper review soon, because this book deserves it."
- title: "Babylon's Ashes"
  author: "James S.A. Corey"
  cover: "/assets/img/books/babylons-ashes.jpg"
  start: "2025-09-25"
  end: "2025-10-17"
  summary: "The conclusion to the second trilogy of the series. This book picks up with a mystery setup since the previous one, and it does so masterfully. I really enjoyed the new character dynamics and how it set everything in place while giving closure to many characters as well. It was fantastic, even if I could already tell how it would end like 10 chapters in advance."
- title: "Rogue Protocol"
  author: "Martha Wells"
  cover: "/assets/img/books/rogue-protocol.jpg"
  start: "2025-09-09"
  end: "2025-09-19"
  summary: "After uncovering its past, Murderbot decides to help out the humans from the first book, who have gotten in trouble due to its escape. Murderbot looks for clues about the shady company that almost got it and its humans killed before. For this, Murderbot ventures into an abandoned planet, alongside a new group of humans who are at the right place, but at the worst of times."
- title: "Hollow Knight - Wanderer's Journal"
  author: "Ryan Novak, Kari Fry"
  cover: "/assets/img/books/hollow-knight.jpg"
  start: "2025-09-16"
  end: "2025-09-16" 
  summary: "This is a wonderful physical collector's item, featuring a lot of game art and illustrations, maps and the like. The quality of the paper, printing and finish is absolutely fantastic, definitely worth getting just for that The quality of the paper, printing and finish is absolutely fantastic, definitely worth getting just for that."
- title: "Artificial Condition"
  author: "Martha Wells"
  cover: "/assets/img/books/artificial-condition.jpg"
  start: "2025-09-05"
  end: "2025-09-09" 
  summary: "Murderbot ventures in a journey to uncover the truth of its past—deleted from its memory by the company who built it—and figure out a new purpose in life after escaping from the people who freed it in the frist place. This is done while being pestered by his worst best new friend, ART, a super smart computer that will help him out for this journ super smart computer that will help him out for this journey!"
- title: "All Systems Red"
  author: "Martha Wells"
  cover: "/assets/img/books/all-systems-red.jpg"
  start: "2025-08-28"
  end: "2025-09-04" 
  summary: "Meet Murderbot, a SecUnit tasked with protecting a group of humans surveying an undocumented planet. The plot is a simple “someone is trying to kill us so we got to escape from the planet,” however, what makes this story great is how everything is told from Murderbot’s perspective. Murderbot actually jailbroke itself, and its personality shines through at every moment, it just wants to be left alone and work when needed..."
- title: "Nemesis Games"
  author: "James S.A. Corey"
  cover: "/assets/img/books/nemesis-games.jpg"
  start: "2025-06-17"
  end: "2025-09-03"
  summary: "As Humanity is eager to embark on to new planets and reach new frontiers, lots of different events begin to unfold, a plot against Holden, against Earth, against Mars and the OPA, that plans to shake the very foundations of mankind. I absolutely love the political intrigue and the family drama that happens on this one, I was on the edge of my seat as the dangers faced by each and everyone of the Rocinante’s crew grew bigger every second. This was a terrifying entry in the series, and genuinely intense. Lovely stuff."
- title: "The Big Time"
  author: "Fritz Leiber"
  cover: "/assets/img/books/the-big-time.jpg"
  start: "2025-05-09"
  end: "2025-06-17"
  summary: "Featuring a cast of characters from different time periods and species, during a war across time between the Spiders and the Snakes—two factions that we know very little about. The war stays in the background, as the actual story happens in a pocket of time where soldiers go to rest and recover. The protagonist works providing that relief, as a friend, a nurse, an escort and the like. Suddenly, this pocket of time gets “stuck”, and the device that controls this is stolen, as an atomic bomb starts ticking. And now we are in a detective story! This is a weird one."
- title: "The Space Merchants"
  author: "C.M. Kornbluth, Frederik Pohl"
  cover: "/assets/img/books/the-space-merchants.jpg"
  start: "2025-02-17"
  end: "2025-05-09"
  summary: "A classic piece of science fiction satire where we follow the life of a copysmith workin in the marketing industry, tasked with convincing the world to colonize Venus. Mitchell Courtenay is on its way to the top of the company, but he ends up betrayed by a rival, his identity is lost and he’s sent to prison, I mean, to work and live the life of a consumer, enslaved by contracts and debt. This book deals with how he tries to recover his misadventures as he tries to recover his life and seek revenge. There are certainly some dated aspects about it, but the story is entertaining and thought-provoking."
- title: "Cibola Burn"
  author: "James S.A. Corey"
  cover: "/assets/img/books/cibola-burn.jpg"
  start: "2025-03-17"
  end: "2025-05-05"
  summary: "With new worlds available to mankind, a rogue ship has decided to colonize one of the new planets. After a company gets permission to get into the same planet and sent a ship to mine its resources and claim them as their own, conflict ensues, and Holden is tasked to step in and resolve them. Of course, things don’t go very well when alien technology starts to show up. I loved the build-up of this one, the absolutely catastrophe and implications of how the plot unfolds. Really awesome start to the second Expanse trilogy."
- title: "Abaddon's Gate"
  author: "James S.A. Corey"
  cover: "/assets/img/books/abaddons-gate.jpg"
  start: "2025-01-04"
  end: "2025-01-15"
  summary: "After a big ring shows up, Humanity discovers it’s actually a gate, that leads to some unknown location. James Holden and his crew decide to—or are forced to—fly there, and there are many more ships that want to study or see what’s up. However, unexpected things start to happen, and everything turns to chaos. This one was amazing, and I was on the edge of my seat at every moment. It also features a lot of worldbuilding regarding religion, as well as a very interesting antagonist. A fantastic entry to the series."
- title: "The Murder on the Links"
  author: "Agatha Christie"
  cover: "/assets/img/books/the-murder-on-the-links.jpg"
  start: "2025-01-02"
  end: "2025-01-28"
  summary: "This was an amazing read full of twists and turns, where Poirot has to solve yet another murder mystery. Featuring a fun Sherlock Holmes parody, a romantic subplot and many many twists and turns that made me unable to follow up on who had done it. An entertaining read that I thoroughly enjoyed."
